[package]
edition = "2021"
name = "_ch_rust_lance"
version = "0.1.0"

# The build is `--offline --locked` (see contrib/corrosion-cmake), so these deps must be
# vendored into contrib/rust_vendor/ via ./rust/vendor.sh before the first build.
# `arrow` is pinned to the SAME major (58) that `lance` 7.0.0 uses, so cargo unifies it to a
# single crate instance — otherwise the `arrow::ffi` types would not match across the boundary.
# v1 uses default-features = false (local filesystem only); cloud object stores
# (aws/azure/gcp/oss) are enabled later via lance features when M3 needs them.
[dependencies]
lance = { version = "7.0.0", default-features = false }
arrow = { version = "58", default-features = false, features = ["ffi"] }
arrow-array = { version = "58", default-features = false }
arrow-schema = { version = "58", default-features = false }
futures = "0.3"
tokio = { version = "1.23", features = ["rt-multi-thread"] }

[lib]
crate-type = ["staticlib"]
